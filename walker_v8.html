<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walker 星系覆蓋熱力圖與最佳化</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#667085;--line:#d9dde3;--acc:#2563eb;--accfg:#fff;--bad:#c2410c;--good:#059669}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--fg:#e6e8eb;--mut:#9aa3af;--line:#2a2f38;--acc:#4f8cff;--accfg:#fff;--bad:#fb923c;--good:#34d399}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 10px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stack{display:grid;gap:14px;min-width:0}
fieldset{border:0;margin:0 0 10px;padding:0}
legend{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:13px}
label.chk input{width:auto}
.derived{font-size:12px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px;margin:4px 0 10px;white-space:pre-line}
.btns{display:flex;gap:8px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:9px 12px;cursor:pointer}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);flex:1;font-weight:600}
button.sm{padding:5px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:12px;min-height:1em;margin-top:6px;white-space:pre-line}
.bar{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.bar>div{height:100%;width:0;background:var(--acc);transition:width .15s}
.progtxt{font-size:12px;color:var(--mut);margin-top:4px;min-height:1.2em}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;padding:7px 6px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--accfg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{padding:6px 9px;font-size:12.5px}
.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
canvas#map{width:100%;display:block;touch-action:none}
.sw{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;border-radius:3px;color:#111;font-weight:600}
.cbar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--mut)}
canvas#cb{flex:1;height:12px;border-radius:4px;min-width:0}
.readout{font-size:12px;color:var(--mut);margin-top:6px;min-height:2.6em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px;min-width:0}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:11px;color:var(--mut)}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px}
.placeholder{color:var(--mut);padding:30px 10px;text-align:center}
.note{font-size:11.5px;color:var(--mut);line-height:1.6}
.hidden{display:none!important}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.summary{background:var(--bg);border-radius:8px;padding:10px;font-size:13px;margin-top:8px;line-height:1.6}
textarea{width:100%;height:120px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;margin-top:8px}
h2{font-size:15px;margin:0 0 8px}
</style>
</head>
<body>
<main>
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 10px">
  <h1 data-i="title" style="margin:0">Walker 星系覆蓋熱力圖與最佳化</h1>
  <div class="seg" id="lang" role="group" aria-label="Language" style="margin:0;width:auto"><button data-l="en">English</button><button data-l="zh">中文</button><button data-l="ja">日本語</button></div>
</div>
<div class="layout">
<section class="card" id="form">
  <div class="seg" id="modeSeg"><button data-v="heat" class="on" data-i="modeHeat">熱力圖</button><button data-v="opt" data-i="modeOpt">最佳化設計</button></div>

  <fieldset><legend data-i="lgShared">覆蓋區域與需求</legend>
    <div class="grid2">
      <label class="full"><span data-i="region">區域</span><select id="preset">
        <option value="global" data-i="pre_global">全球</option><option value="taiwan" data-i="pre_taiwan">台灣附近</option><option value="japan" data-i="pre_japan">日本列島附近</option>
        <option value="nmid" data-i="pre_nmid">北半球中緯度</option><option value="north" data-i="pre_north">北半球</option><option value="eq" data-i="pre_eq"></option><option value="custom" data-i="pre_custom">自訂</option></select></label>
      <label><span data-i="latMin"></span><input id="latMin" type="number" step="any" value="-90"></label>
      <label><span data-i="latMax"></span><input id="latMax" type="number" step="any" value="90"></label>
      <label><span data-i="lonMin"></span><input id="lonMin" type="number" step="any" value="-180"></label>
      <label><span data-i="lonMax"></span><input id="lonMax" type="number" step="any" value="180"></label>
      <label><span data-i="elev"></span><input id="elev" type="number" min="0" max="89" step="any" value="20"></label>
      <label><span data-i="kmin"></span><input id="kmin" type="number" min="1" max="50" step="1" value="1"></label>
      <label class="full"><span data-i="dur"></span><input id="dur" type="number" min="0.01" step="any" value="24"></label>
    </div>
  </fieldset>

  <div id="heatForm">
  <fieldset><legend data-i="mission"></legend>
    <select id="mission"><option value="" data-i="mis_none"></option><option value="tw" data-i="mis_tw"></option><option value="jp" data-i="mis_jp"></option><option value="eq" data-i="mis_eq"></option></select>
  </fieldset>
  <fieldset><legend data-i="lgWalker"></legend>
    <div class="grid2">
      <label><span data-i="T"></span><input id="T" type="number" min="1" step="1" value="1"></label>
      <label><span data-i="P"></span><input id="P" type="number" min="1" step="1" value="1"></label>
      <label><span data-i="F"></span><input id="F" type="number" min="0" step="1" value="0"></label>
      <label><span data-i="pat"></span><select id="pat"><option value="360">Delta (RAAN 360°)</option><option value="180">Star (RAAN 180°)</option></select></label>
    </div>
  </fieldset>
  <fieldset><legend data-i="lgOrbit"></legend>
    <div class="grid2">
      <label><span data-i="h"></span><input id="h" type="number" min="100" step="any" value="600"></label>
      <label><span data-i="inc"></span><input id="inc" type="number" min="0" max="180" step="any" value="50"></label>
      <label><span data-i="raan0"></span><input id="raan0" type="number" step="any" value="0"></label>
      <label><span data-i="u0"></span><input id="u0" type="number" step="any" value="0"></label>
    </div>
    <label class="chk" style="margin-top:6px"><input id="j2" type="checkbox"><span data-i="j2"></span></label>
  </fieldset>
  <fieldset><legend data-i="lgSample"></legend>
    <div class="grid2">
      <label><span data-i="dt"></span><input id="dt" type="number" min="0.1" step="any" value="60"></label>
      <label><span data-i="grid"></span><input id="grid" type="number" min="0.1" step="0.1" value="1"></label>
    </div>
  </fieldset>
  <div class="derived" id="derived"></div>
  <div class="btns"><button class="primary" id="run" data-i="run"></button><button id="cancel" disabled data-i="cancel"></button></div>
  </div>

  <div id="optForm" class="hidden">
  <fieldset><legend data-i="lgSpace"></legend>
    <div class="grid2">
      <label><span data-i="hMin"></span><input id="hMin" type="number" step="any" value="500"></label>
      <label><span data-i="hMax"></span><input id="hMax" type="number" step="any" value="1800"></label>
      <label><span data-i="iMin"></span><input id="iMin" type="number" step="any" value="20"></label>
      <label><span data-i="iMax"></span><input id="iMax" type="number" step="any" value="110"></label>
      <label><span data-i="tMin"></span><input id="tMin" type="number" step="1" value="6"></label>
      <label><span data-i="tMax"></span><input id="tMax" type="number" step="1" value="80"></label>
      <label><span data-i="pat"></span><select id="oPat"><option value="360">Delta</option><option value="180">Star</option></select></label>
      <label><span data-i="target"></span><input id="target" type="number" min="1" max="100" step="any" value="100"></label>
      <label class="full"><span data-i="objective"></span><select id="objective"><option value="sat" data-i="objSat"></option><option value="alt" data-i="objAlt"></option></select></label>
    </div>
  </fieldset>
  <fieldset><legend data-i="lgSearch"></legend>
    <div class="grid2">
      <label><span data-i="sGrid"></span><input id="sGrid" type="number" min="0.1" step="any" value="0.5"></label>
      <label><span data-i="sDt"></span><input id="sDt" type="number" min="1" step="any" value="300"></label>
      <label class="full"><span data-i="effort"></span><select id="effort"><option value="quick" data-i="effQuick"></option><option value="standard" selected data-i="effStd"></option><option value="deep" data-i="effDeep"></option></select></label>
    </div>
    <label class="chk" style="margin-top:6px"><input id="oJ2" type="checkbox"><span data-i="oJ2"></span></label>
  </fieldset>
  <div class="btns"><button class="primary" id="optRun" data-i="optRun"></button><button id="optCancel" disabled data-i="optCancel"></button></div>
  </div>

  <div class="err" id="err"></div>
  <div class="bar"><div id="barfill"></div></div>
  <div class="progtxt" id="progtxt"></div>
</section>

<div class="stack">
<section class="card" id="optCard" style="display:none">
  <h2 data-i="optTitle"></h2>
  <div class="summary" id="optSummary"></div>
  <div class="tw"><table><thead><tr><th>#</th><th>T/P/F</th><th>h km</th><th>i</th><th>Ω₀</th><th>u₀</th><th data-i="thSearch"></th><th data-i="thVal"></th><th data-i="thFull"></th><th data-i="thPass"></th><th></th></tr></thead><tbody id="optRows"></tbody></table></div>
  <div class="note" style="margin-top:8px" data-i="optNote"></div>
</section>

<section class="card">
  <div class="tabs" id="tabs">
    <button data-m="cov" class="on" data-i="tab_cov"></button>
    <button data-m="win" data-i="tab_win"></button>
    <button data-m="pas" data-i="tab_pas"></button>
    <button data-m="mean" data-i="tab_mean"></button>
    <button data-m="min" data-i="tab_min"></button>
    <button data-m="snap" data-i="tab_snap"></button>
  </div>
  <div id="ph" class="placeholder" data-i="ph"></div>
  <div id="mapwrap" class="hidden">
    <canvas id="map"></canvas>
    <div id="snapCtl" class="hidden">
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="sm" id="play" style="min-width:58px"></button>
        <input id="slider" type="range" min="0" max="0" value="0" style="flex:1;padding:0"><span id="tlabel" style="font-size:12px;color:var(--mut);min-width:86px;text-align:right;font-variant-numeric:tabular-nums"></span></div>
      <div id="swatch" style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;font-size:11px"></div>
    </div>
    <div class="cbar" id="cbarRow"><span id="cbmin">0</span><canvas id="cb" width="512" height="1"></canvas><span id="cbmax">100</span></div>
    <div class="readout" id="readout"></div>
    <div class="opts">
      <label class="chk"><input id="auto" type="checkbox"><span data-i="auto"></span></label>
      <label class="chk"><input id="coast" type="checkbox" checked><span data-i="coast"></span></label>
      <label class="chk"><input id="zoom" type="checkbox"><span data-i="zoom"></span></label>
      <label class="chk"><input id="smooth" type="checkbox"><span data-i="smooth"></span></label>
    </div>
    <div class="stats" id="stats"></div>
    <div class="btns" style="margin-top:10px;flex-wrap:wrap"><button class="sm" id="cpJson" data-i="cpJson"></button><button class="sm" id="cpCsv" data-i="cpCsv"></button></div>
    <textarea id="cpBox" class="hidden" readonly></textarea>
  </div>
</section>

<section class="card note" id="notes"></section>
</div>
</div>
</main>

<script id="core" type="text/plain">
const RE=6378.137, MU=398600.4418, J2C=1.08262668e-3, WE=7.2921150e-5, D2R=Math.PI/180, TAU=2*Math.PI;
function dims(p){const ls=p.latMax-p.latMin, os=p.lonMax-p.lonMin;
  const nLat=Math.max(1,Math.round(ls/p.grid)), nLon=Math.max(1,Math.round(os/p.grid));
  return {nLat,nLon,dLat:ls/nLat,dLon:os/nLon};}
function orbit(p){
  const r=RE+p.h, n=Math.sqrt(MU/(r*r*r)), inc=p.inc*D2R, ci=Math.cos(inc), si=Math.sin(inc);
  let Od=0, ud=n;
  if(p.j2){const f=J2C*(RE/r)*(RE/r); Od=-1.5*n*f*ci; ud=n*(1+0.75*f*(8*ci*ci-2));}
  const el=p.elev*D2R, lam=Math.acos(RE*Math.cos(el)/r)-el;
  const S=p.T/p.P, sats=[];
  for(let q=0;q<p.P;q++)for(let j=0;j<S;j++)
    sats.push({O0:(p.raan0+q*p.pat/p.P)*D2R, u0:(p.u0+j*360/S+q*p.F*360/p.T)*D2R});
  return {ci,si,Od,ud,lam,sats};
}
function simulate(p,k0,k1,onProg){
  const G=dims(p), nLat=G.nLat, nLon=G.nLon, N=nLat*nLon, O=orbit(p), lam=O.lam, cl=Math.cos(lam), ci=O.ci, si=O.si;
  const dLatR=G.dLat*D2R, dLonR=G.dLon*D2R, lat0=p.latMin*D2R, lon0=p.lonMin*D2R, kmin=p.kmin;
  const cov=new Uint32Array(N), win=new Uint32Array(N), pas=new Uint32Array(N), sumV=new Uint32Array(N), visN=new Uint32Array(N);
  const minV=new Uint16Array(N).fill(65535), maxV=new Uint16Array(N);
  const cnt=new Uint16Array(N), stamp=new Int32Array(N).fill(-9), lastC=new Int32Array(N).fill(-9), touched=new Int32Array(N);
  const sinR=new Float64Array(nLat), cosR=new Float64Array(nLat), cLon=new Float64Array(nLon);
  for(let i=0;i<nLat;i++){const f=lat0+(i+0.5)*dLatR; sinR[i]=Math.sin(f); cosR[i]=Math.cos(f);}
  for(let j=0;j<nLon;j++) cLon[j]=lon0+(j+0.5)*dLonR;
  function sub(s,k){
    const t=k*p.dt, Om=s.O0+O.Od*t, u=s.u0+O.ud*t, cu=Math.cos(u), su=Math.sin(u), cO=Math.cos(Om), sO=Math.sin(Om);
    const x=cO*cu-sO*su*ci, y=sO*cu+cO*su*ci, z=su*si;
    let lon=Math.atan2(y,x)-WE*t; lon-=TAU*Math.floor((lon+Math.PI)/TAU);
    return [Math.asin(Math.max(-1,Math.min(1,z))), lon];
  }
  function halfW(i,sp,cp){const den=cosR[i]*cp, num=cl-sinR[i]*sp;
    if(den<1e-12) return num<=0?9:-1; const c=num/den; if(c>=1) return -1; if(c<=-1) return 9; return Math.acos(c);}
  const ks=k0>0?k0-1:k0, nS=k1-ks, sats=O.sats;
  for(let k=ks;k<k1;k++){
    const counting=k>=k0; let nt=0;
    for(let si2=0;si2<sats.length;si2++){
      const s=sats[si2], A=sub(s,k), fs=A[0], ls=A[1], sfs=Math.sin(fs), cfs=Math.cos(fs);
      const chk=counting&&k>0; let lp=0,sfp=0,cfp=0;
      if(chk){const B=sub(s,k-1); lp=B[1]; sfp=Math.sin(B[0]); cfp=Math.cos(B[0]);}
      let i0=Math.ceil((fs-lam-lat0)/dLatR-0.5), i1=Math.floor((fs+lam-lat0)/dLatR-0.5);
      if(i0<0)i0=0; if(i1>nLat-1)i1=nLat-1;
      for(let i=i0;i<=i1;i++){
        const hw=halfW(i,sfs,cfs); if(hw<0) continue;
        const ph=chk?halfW(i,sfp,cfp):-1, base=i*nLon;
        for(let sh=-1;sh<=1;sh++){
          let j0,j1;
          if(hw>=Math.PI){ if(sh!==0) continue; j0=0; j1=nLon-1; }
          else{ const c=ls+sh*TAU-lon0; j0=Math.ceil((c-hw)/dLonR-0.5); j1=Math.floor((c+hw)/dLonR-0.5); if(j0<0)j0=0; if(j1>nLon-1)j1=nLon-1; }
          for(let j=j0;j<=j1;j++){
            const idx=base+j;
            if(stamp[idx]!==k){stamp[idx]=k; cnt[idx]=0; touched[nt++]=idx;}
            cnt[idx]++;
            if(counting){
              let inPrev=false;
              if(ph>=0){ if(ph>=9) inPrev=true; else { let d=cLon[j]-lp; d-=TAU*Math.floor((d+Math.PI)/TAU); inPrev=(d<=ph&&d>=-ph); } }
              if(!inPrev) pas[idx]++;
            }
          }
        }
      }
    }
    for(let t=0;t<nt;t++){
      const idx=touched[t], c=cnt[idx];
      if(counting){
        sumV[idx]+=c; visN[idx]++; if(c<minV[idx])minV[idx]=c; if(c>maxV[idx])maxV[idx]=c;
        if(c>=kmin){cov[idx]++; if(lastC[idx]!==k-1) win[idx]++; lastC[idx]=k;}
      } else if(c>=kmin) lastC[idx]=k;
    }
    if(onProg) onProg((k-ks+1)/nS);
  }
  const steps=k1-k0; for(let i=0;i<N;i++) if(visN[i]<steps) minV[i]=0;
  return {cov,win,pas,sumV,minV,maxV,nLat,nLon};
}
function handle(m,onProg){
  if(m.type==='run'){const r=simulate(m.p,m.k0,m.k1,onProg);return {res:r,transfer:[r.cov.buffer,r.win.buffer,r.pas.buffer,r.sumV.buffer,r.minV.buffer,r.maxV.buffer]};}
  if(m.type==='eval'){
    const p=m.p, r=simulate(p,0,p.nSteps,null), lat0=p.latMin, dLat=(p.latMax-p.latMin)/r.nLat;
    let sw=0,sc=0,full=0,sv=0;
    for(let i=0;i<r.nLat;i++){const w=Math.max(1e-7,Math.cos((lat0+(i+0.5)*dLat)*D2R));
      for(let j=0;j<r.nLon;j++){const idx=i*r.nLon+j; sw+=w; sc+=w*r.cov[idx]; sv+=w*r.sumV[idx]; if(r.cov[idx]===p.nSteps) full+=w;}}
    return {res:{ratio:Math.min(1,sc/(sw*p.nSteps)),full:full/sw,meanVis:sv/(sw*p.nSteps),cells:r.nLat*r.nLon},transfer:[]};
  }
}
</script>

notes:`<b>Coverage</b>: a cell is covered when the number of satellites above the minimum elevation ≥ the required simultaneous count. Overlapping satellites are not double-counted, so coverage time is capped at 100%.<br><b>Contacts (merged)</b>: each continuous covered interval counts once. <b>Passes (per sat)</b>: every time a satellite comes into view counts once (independent of the simultaneous requirement); a satellite already in view at t=0 counts too.<br><b>Snapshot</b>: visible-satellite count per cell at one instant (dark blue = 0, yellow→red = more) plus sub-satellite points; drag the timeline or play, similar to SaVi's coverage-diversity view.<br><b>Min visible sats</b>: visible count at the worst instant. Statistics are area-weighted by cos(latitude).<br><b>Model</b>: spherical Earth R = 6378.137 km, circular two-body orbits (optional J2 secular RAAN and u rates), GMST = 0 at t = 0, so Ω₀ is the Earth-fixed node longitude at t = 0. Each footprint is computed analytically per latitude row and matches a brute-force per-cell, per-satellite check.<br><b>Phasing</b>: plane k, slot j: Ω = Ω₀ + k·(pattern angle)/P; u = u₀ + j·360°/(T/P) + k·F·360°/T.<br>Not modelled: elliptical orbits, link budget, terrain masking, real UTC epoch.`,

function t(k,...a){let s=(I18N[LANG]&&I18N[LANG][k]);if(s===undefined)s=I18N.zh[k];if(s===undefined)return k;return s.replace(/\{(\d)\}/g,(m,i)=>a[+i]);}
const $=id=>document.getElementById(id);
const RE=6378.137, MU=398600.4418, D2R=Math.PI/180;
const HC=Math.max(1,Math.min(navigator.hardwareConcurrency||4,8));
let handleMain=null;
function getMain(){if(!handleMain) handleMain=new Function(coreSrc+';return handle;')();return handleMain;}

// ---------- worker pool ----------
class Pool{
  constructor(n){this.idle=[];this.all=[];this.queue=[];this.fallback=false;this.dead=false;this.busy=false;
    try{const src=coreSrc+`\nonmessage=e=>{const m=e.data;let lt=0;try{const r=handle(m,f=>{const now=Date.now();if(now-lt>120){lt=now;postMessage({prog:f});}});postMessage({res:r.res},r.transfer);}catch(err){postMessage({error:String(err&&err.stack||err)});}};`;
      const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
      for(let i=0;i<n;i++){const w=new Worker(url);this.all.push(w);this.idle.push(w);}
    }catch(e){this.fallback=true;}}
  exec(msg,onProg){return new Promise((res,rej)=>{this.queue.push({msg,onProg,res,rej});this.pump();});}
  pump(){
    if(this.dead) return;
    if(this.fallback){ if(this.busy) return; const job=this.queue.shift(); if(!job) return; this.busy=true;
      setTimeout(()=>{ if(this.dead) return; try{job.res(getMain()(job.msg,null).res);}catch(e){job.rej(e);} this.busy=false; this.pump(); },0); return; }
    while(this.idle.length&&this.queue.length){
      const w=this.idle.pop(), job=this.queue.shift();
      w.onmessage=e=>{const d=e.data; if(d.prog!==undefined){job.onProg&&job.onProg(d.prog);return;}
        if(d.error) job.rej(new Error(d.error)); else job.res(d.res); this.idle.push(w); this.pump();};
      w.onerror=ev=>{ev.preventDefault&&ev.preventDefault(); // worker unusable: switch to main thread
        this.all.forEach(x=>x.terminate()); this.all=[]; this.idle=[]; this.fallback=true; this.queue.unshift(job); this.pump();};
      w.postMessage(job.msg);
    }
  }
  terminate(){this.dead=true;this.all.forEach(w=>w.terminate());this.queue.forEach(j=>j.rej(new Error('cancel')));this.queue=[];}
}

const num=id=>Number($(id).value);
function readShared(){return {latMin:num('latMin'),latMax:num('latMax'),lonMin:num('lonMin'),lonMax:num('lonMax'),elev:num('elev'),kmin:num('kmin'),dur:num('dur')};}
function checkShared(s,e){
  if(!(s.latMin>=-90&&s.latMax<=90&&s.latMin<s.latMax)) e.push(t('e_lat'));
  if(!(s.lonMin>=-540&&s.lonMax<=540&&s.lonMin<s.lonMax&&s.lonMax-s.lonMin<=360)) e.push(t('e_lon'));
  if(!(s.elev>=0&&s.elev<90)) e.push(t('e_elev'));
  if(!(Number.isInteger(s.kmin)&&s.kmin>=1)) e.push(t('e_kmin'));
  if(!(s.dur>0)) e.push(t('e_dur'));
}
function readHeat(){
  const s=readShared(); const p={...s,T:num('T'),P:num('P'),F:num('F'),pat:num('pat'),h:num('h'),inc:num('inc'),raan0:num('raan0'),u0:num('u0'),j2:$('j2').checked,dt:num('dt'),grid:num('grid')};
  p.nSteps=Math.max(1,Math.floor(p.dur*3600/p.dt+1e-9)); return p;
}
function checkHeat(p){const e=[];checkShared(p,e);
  if(!(p.T>=1&&Number.isInteger(p.T))) e.push(t('e_T'));
  if(!(p.P>=1&&Number.isInteger(p.P))) e.push(t('e_P')); else if(p.T%p.P) e.push(t('e_TP'));
  if(!(Number.isInteger(p.F)&&p.F>=0&&p.F<p.P)) e.push(t('e_F'));
  if(!(p.h>=100)) e.push(t('e_h'));
  if(!(p.inc>=0&&p.inc<=180)) e.push(t('e_inc'));
  if(!(p.dt>0)) e.push(t('e_dt'));
  if(!(p.grid>=0.1)) e.push(t('e_grid'));
  if(p.kmin>p.T) e.push(t('e_kT'));
  return e;}
const fmtN=n=>LANG==='en'?(n>=1e9?(n/1e9).toFixed(2)+' B':n>=1e6?(n/1e6).toFixed(2)+' M':n>=1e4?(n/1e3).toFixed(1)+' k':String(Math.round(n))):(n>=1e8?(n/1e8).toFixed(2)+' 億':n>=1e4?(n/1e4).toFixed(1)+(LANG==='ja'?' 万':' 萬'):String(Math.round(n)));
function geom(h,elev){const r=RE+h,el=elev*D2R,lam=Math.acos(RE*Math.cos(el)/r)-el;
  return {T:2*Math.PI*Math.sqrt(r**3/MU),lam,slant:Math.sqrt(r*r-(RE*Math.cos(el))**2)-RE*Math.sin(el)};}
function dimsMain(p){const nLat=Math.max(1,Math.round((p.latMax-p.latMin)/p.grid)),nLon=Math.max(1,Math.round((p.lonMax-p.lonMin)/p.grid));return {nLat,nLon,N:nLat*nLon};}
function updDerived(){
  const p=readHeat(),e=checkHeat(p); if(e.length){$('derived').textContent=e.join('\n');return;}
  const g=geom(p.h,p.elev),D=dimsMain(p),cellA=(p.grid*D2R)**2*Math.cos(D2R*Math.min(80,Math.max(Math.abs(p.latMin),Math.abs(p.latMax))>0?(p.latMin+p.latMax)/2:0));
  const fp=Math.min(D.N,2*Math.PI*(1-Math.cos(g.lam))/Math.max(1e-9,Math.abs(cellA)));
  const pgD=globSpec(p),work=workEst(p)+(pgD?workEst(pgD):0);
  $('derived').textContent=t('d1',(g.T/60).toFixed(1),(g.lam/D2R).toFixed(2),fmtN(g.slant))+'\n'+t('d2',fmtN(p.nSteps),D.nLon,D.nLat,fmtN(D.N))+'\n'+t('d3',fmtN(work))+(work>3e10?t('dHeavy'):'');
}
document.querySelectorAll('#form input,#form select').forEach(el=>el.addEventListener('input',updDerived));updDerived();

function setProg(f,t){$('barfill').style.width=(Math.max(0,Math.min(1,f))*100).toFixed(1)+'%';$('progtxt').textContent=t;}
let pool=null, cancelled=false, result=null, mode='cov';
function busy(b){['run','optRun'].forEach(k=>$(k).disabled=b);['cancel','optCancel'].forEach(k=>$(k).disabled=!b);}
function stop(){cancelled=true;if(pool){pool.terminate();pool=null;}busy(false);setProg(0,t('cancelled'));}
$('cancel').onclick=stop;$('optCancel').onclick=stop;

// ---------- heatmap ----------
var GLOB_MIN_GRID=0.5;
function globSpec(p){return isGlob(p)?null:{...p,latMin:-90,latMax:90,lonMin:-180,lonMax:180,grid:Math.max(p.grid,0.5)};}
function workEst(p){const g=geom(p.h,p.elev),D=dimsMain(p),cellA=(p.grid*D2R)**2*Math.max(0.2,Math.cos(D2R*(p.latMin+p.latMax)/2));
  return p.nSteps*p.T*Math.min(D.N,2*Math.PI*(1-Math.cos(g.lam))/cellA);}
async function runHeat(){
  const p=readHeat(),e=checkHeat(p);$('err').textContent=e.join('\n');if(e.length)return;
  cancelled=false;busy(true);const t0=performance.now();
  const specs=[p];const pg=globSpec(p);if(pg)specs.push(pg);
  const Ns=specs.map(q=>dimsMain(q).N),Wk=specs.map(workEst),Wt=Wk.reduce((a,b)=>a+b,0);
  const W=Math.max(1,Math.min(HC,Math.floor(7e8/(Math.max(...Ns)*40)),p.nSteps));
  pool=new Pool(W);
  const accs=Ns.map(N=>({cov:new Uint32Array(N),win:new Uint32Array(N),pas:new Uint32Array(N),sumV:new Uint32Array(N),minV:new Uint16Array(N).fill(65535),maxV:new Uint16Array(N)}));
  const jobs=[];specs.forEach((q,si)=>{for(let w=0;w<W;w++)jobs.push({si,q,k0:Math.floor(p.nSteps*w/W),k1:Math.floor(p.nSteps*(w+1)/W),f:0});});
  const tick=()=>{let s2=0;for(const j of jobs)s2+=j.f*(j.k1-j.k0)/p.nSteps*Wk[j.si];const f=s2/Wt,el=(performance.now()-t0)/1000;
    setProg(f,t('progRun',(f*100).toFixed(1),el.toFixed(1))+(f>0.02?t('progEta',(el/f-el).toFixed(0)):'')+(LANG==='en'?' | ':'｜')+(pool&&pool.fallback?t('mainThread'):t('threads',W)));};
  try{
    await Promise.all(jobs.map(j=>pool.exec({type:'run',p:j.q,k0:j.k0,k1:j.k1},f=>{j.f=f;tick();}).then(r=>{
      const A=accs[j.si],N=Ns[j.si];
      for(let i=0;i<N;i++){A.cov[i]+=r.cov[i];A.win[i]+=r.win[i];A.pas[i]+=r.pas[i];A.sumV[i]+=r.sumV[i];
        if(r.minV[i]<A.minV[i])A.minV[i]=r.minV[i];if(r.maxV[i]>A.maxV[i])A.maxV[i]=r.maxV[i];}
      j.f=1;tick();})));
  }catch(err){ if(!cancelled){$('err').textContent=t('failCalc')+err.message;busy(false);} return; }
  if(cancelled) return;
  pool.terminate();pool=null;busy(false);
  snapK=0;playing=false;$('play').textContent=t('play');
  const mk=(q,A)=>{const D=dimsMain(q);return {p:q,nLat:D.nLat,nLon:D.nLon,N:D.N,...A};};
  result=mk(p,accs[0]);result.glob=pg?mk(pg,accs[1]):result;result.secs=(performance.now()-t0)/1000;
  setProg(1,t('done',result.secs.toFixed(2)));
  $('ph').classList.add('hidden');$('mapwrap').classList.remove('hidden');$('cpBox').classList.add('hidden');
  buildImage();draw();
}
$('run').onclick=runHeat;

function readOpt(){const s=readShared();const c={...s,hMin:num('hMin'),hMax:num('hMax'),iMin:num('iMin'),iMax:num('iMax'),tMin:num('tMin'),tMax:num('tMax'),
  pat:num('oPat'),target:num('target'),objective:$('objective').value,sGrid:num('sGrid'),sDt:num('sDt'),effort:$('effort').value,j2:$('oJ2').checked};
  const e=[];checkShared(c,e);
  if(!(c.hMin>=150&&c.hMin<=c.hMax&&c.hMax<=60000)) e.push(t('e_hR'));
  if(!(c.iMin>=0&&c.iMax<=180&&c.iMin<=c.iMax)) e.push(t('e_iR'));
  if(!(Number.isInteger(c.tMin)&&Number.isInteger(c.tMax)&&c.tMin>=1&&c.tMin<=c.tMax&&c.tMax<=1000)) e.push(t('e_tR'));
  if(c.kmin>c.tMax) e.push(t('e_ktmax'));
  if(!(c.target>0&&c.target<=100)) e.push(t('e_target'));

    x.setLineDash([]);}
  if(mode==='snap'&&snap){const r0=Math.max(2,Math.min(4,pw/220));for(const s2 of snap.sats)for(const sh of [-360,0,360]){const lo=s2[1]+sh;if(lo<V.lonMin-5||lo>V.lonMax+5)continue;
    x.beginPath();x.arc(X(lo),Y(s2[0]),r0,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.lineWidth=1;x.strokeStyle='#111';x.stroke();}}
  x.restore();
  const fg=getComputedStyle(document.body).color;x.fillStyle=fg;x.globalAlpha=.75;x.font='10.5px system-ui';x.textAlign='center';x.textBaseline='top';
  for(let v=Math.ceil(V.lonMin/sl)*sl;v<=V.lonMax+1e-9;v+=sl)x.fillText(lonLab(v),X(v),M.t+ph+5);
  x.textAlign='right';x.textBaseline='middle';
  for(let v=Math.ceil(V.latMin/sa)*sa;v<=V.latMax+1e-9;v+=sa)x.fillText((Math.round(v*100)/100)+'°',M.l-5,Y(v));
  x.globalAlpha=1;
}
function cellAt(B,nLat,nLon,lat,lon){if(lat<B.latMin||lat>=B.latMax)return -1;
  for(const sh of [0,360,-360]){const L=lon+sh;if(L>=B.lonMin&&L<B.lonMax){const i=Math.floor((lat-B.latMin)/(B.latMax-B.latMin)*nLat),j=Math.floor((L-B.lonMin)/(B.lonMax-B.lonMin)*nLon);return Math.min(nLat-1,i)*nLon+Math.min(nLon-1,j);}}return -1;}
function readout(ev){
  if(!result||!geo)return;const b=$('map').getBoundingClientRect(),fx=(ev.clientX-b.left-geo.x0)/geo.pw,fy=(ev.clientY-b.top-geo.y0)/geo.ph;
  if(fx<0||fx>=1||fy<0||fy>=1)return;const V=geo.V,lon=V.lonMin+fx*(V.lonMax-V.lonMin),lat=V.latMax-fy*(V.latMax-V.latMin);
  const head=t('roLat',lat.toFixed(2),lonLab(lon));
  if(mode==='snap'&&snap){const q=cellAt(snap.sp,snap.r.nLat,snap.r.nLon,lat,lon);
    $('readout').textContent=head+(q<0?' — '+t('outside'):t('roSnap',$('tlabel').textContent,snap.r.sumV[q]));return;}
  const r=worldView()?result.glob:result,p=r.p,q=cellAt(p,r.nLat,r.nLon,lat,lon);
  if(q<0){$('readout').textContent=head+' — '+t('outside');return;}
  $('readout').textContent=head+t('roFull',(r.cov[q]*100/p.nSteps).toFixed(2),r.win[q],r.pas[q],(r.sumV[q]/p.nSteps).toFixed(2),r.minV[q],r.maxV[q]);
}
$('map').addEventListener('pointermove',readout);$('map').addEventListener('pointerdown',readout);
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));if(result){buildImage();draw();}};
$('auto').onchange=()=>{if(result){buildImage();draw();}};['coast','smooth'].forEach(k=>$(k).onchange=draw);$('zoom').onchange=()=>{if(result){buildImage();draw();}};
window.addEventListener('resize',()=>draw());
function applyLang(){
  document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG;document.title=t('title');[...$('lang').children].forEach(b=>{b.classList.toggle('on',b.dataset.l===LANG);b.setAttribute('aria-pressed',b.dataset.l===LANG);});
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('notes').innerHTML=t('notes');$('readout').textContent=t('readoutHint');$('play').textContent=playing?t('pause'):t('play');
  updDerived();if(result){buildImage();draw();}if(optRes)renderOpt(false);
}
$('lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;try{localStorage.setItem('walkerLang',LANG);}catch(e){}applyLang();};
applyLang();

// ---------- copy ----------
async function copyText(t,btn,label){
  try{await navigator.clipboard.writeText(t);btn.textContent=t('copied');setTimeout(()=>btn.textContent=label,1500);$('cpBox').classList.add('hidden');}
  catch(e){const bx=$('cpBox');bx.value=t;bx.classList.remove('hidden');bx.focus();bx.select();btn.textContent=t('manual');setTimeout(()=>btn.textContent=label,2500);}
}
$('cpJson').onclick=()=>{if(!result)return;const p=result.p,S=p.T/p.P,sats=[];
  for(let k=0;k<p.P;k++)for(let j=0;j<S;j++)sats.push({plane:k,slot:j,raan_deg:+n360(p.raan0+k*p.pat/p.P).toFixed(4),arg_lat_deg:+n360(p.u0+j*360/S+k*p.F*360/p.T).toFixed(4)});
  const st={};for(const m of ['cov','win','pas','mean','min']){const sv=mode;mode=m;const {a,s}=getVal();let mn=Infinity,mx=-Infinity;for(const v of a){if(v<mn)mn=v;if(v>mx)mx=v;}stats(mn*s,mx*s);st[m]={...result.st};mode=sv;}
  buildImage();
  const o={model:'Walker circular two-body, spherical Earth, GMST(t0)=0',params:p,grid:{nLat:result.nLat,nLon:result.nLon},
    stats:{coverage_pct:st.cov,contacts_merged:st.win,passes_per_sat:st.pas,mean_visible:st.mean,min_visible:st.min},satellites_t0:sats};
  copyText(JSON.stringify(o,null,1),$('cpJson'),t('cpJson'));};
$('cpCsv').onclick=()=>{if(!result)return;const r=result,p=r.p;
  if(r.N>200000){$('cpCsv').textContent=t('tooMany',fmtN(r.N));setTimeout(()=>$('cpCsv').textContent=t('cpCsv'),2500);return;}
  const L=['lat_deg,lon_deg,coverage_pct,contacts_merged,passes,mean_visible,min_visible,max_visible'];
  for(let i=0;i<r.nLat;i++)for(let j=0;j<r.nLon;j++){const q=i*r.nLon+j;
    L.push([(p.latMin+(i+0.5)*(p.latMax-p.latMin)/r.nLat).toFixed(4),(p.lonMin+(j+0.5)*(p.lonMax-p.lonMin)/r.nLon).toFixed(4),(r.cov[q]*100/p.nSteps).toFixed(4),r.win[q],r.pas[q],(r.sumV[q]/p.nSteps).toFixed(4),r.minV[q],r.maxV[q]].join(','));}
  copyText(L.join('\n'),$('cpCsv'),t('cpCsv'));};
</script>
